# StorageClass que cria volumes EBS pelo driver CSI (item D2).
# WaitForFirstConsumer: o volume e criado na mesma zona do no onde o Pod do banco foi agendado.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-gp3
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
