# RBAC (itens F1 e F3).
# F1: a ServiceAccount da API so pode LER nodes (recurso de cluster -> ClusterRole).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: store-api-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: store-api-node-reader
subjects:
  - kind: ServiceAccount
    name: store-api
    namespace: store-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: store-api-node-reader
---
# F3: grupo fiap:devs so le Pods e logs em store-prod (sem delete, secrets ou exec).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devs-somente-leitura
  namespace: store-prod
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devs-somente-leitura
  namespace: store-prod
subjects:
  - kind: Group
    name: fiap:devs
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: devs-somente-leitura
