# NetworkPolicy em store-data (itens C5, C6).
# 1) nega TODA entrada; 2) e 3) liberam so quem precisa.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: store-data
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-from-app
  namespace: store-data
spec:
  podSelector:
    matchLabels:
      app: store-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: store-prod
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["store-api", "store-worker", "db-migrate", "store-report"]
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-from-app-and-keda
  namespace: store-data
spec:
  podSelector:
    matchLabels:
      app: store-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: store-prod
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["store-api", "store-worker"]
        - namespaceSelector:            # o operador do KEDA le o tamanho da fila
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - protocol: TCP
          port: 6379
